<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0c">
<title>Venice Drive</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:#0a0a0c;color:#f2f2f4;font:19px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #hd{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;background:#111114;border-bottom:1px solid #23232a;padding:0 10px;z-index:5}
  #hd h1{font-size:16px;margin:0 10px 0 0;font-weight:600;letter-spacing:.02em;white-space:nowrap}
  select,button,textarea,input{font-family:inherit;font-size:18px;color:#f2f2f4;background:#1a1a20;border:1px solid #2e2e38;border-radius:12px}
  select{height:48px;padding:0 8px;flex:1;min-width:0;margin-right:8px}
  button{height:48px;padding:0 14px;cursor:pointer}
  button:active{background:#2a2a34}
  .icon{width:48px;padding:0;font-size:20px;flex:0 0 48px;margin-left:8px}
  #main{position:fixed;top:64px;bottom:92px;left:0;right:0;overflow-y:auto;padding:14px 12px 20px}
  .msg{margin:0 0 14px;padding:13px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;max-width:92%}
  .u{background:#1f3b52;margin-left:auto;border-bottom-right-radius:5px}
  .a{background:#17171c;border:1px solid #24242c;border-bottom-left-radius:5px}
  .sys{background:#241a2e;border:1px solid #3a2a48;font-size:16px;color:#d8c8ea}
  #ft{position:fixed;bottom:0;left:0;right:0;background:#111114;border-top:1px solid #23232a;padding:8px 10px;display:flex;align-items:flex-end;z-index:5}
  #in{flex:1;min-height:56px;max-height:150px;padding:15px;resize:none;margin-right:8px;line-height:1.35}
  #send{width:64px;height:56px;flex:0 0 64px;background:#4b2f6b;border-color:#6a4494;font-size:24px}
  #setup{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0cf0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#131318;border:1px solid #2c2c36;border-radius:18px;padding:22px;max-width:520px;width:100%}
  .card h2{margin:0 0 8px;font-size:22px}
  .card p{margin:0 0 14px;color:#a9a9b8;font-size:16px;line-height:1.5}
  #key{width:100%;height:56px;padding:0 14px;margin-bottom:12px}
  .row{display:flex;align-items:center;margin-bottom:12px;font-size:16px;color:#c9c9d6}
  .row input{width:26px;height:26px;margin-right:10px;flex:0 0 26px}
  .big{width:100%;height:56px;background:#4b2f6b;border-color:#6a4494;font-weight:600;margin-top:4px}
  a{color:#b794f6}
  .hide{display:none!important}
</style>
</head>
<body>

<div id="hd">
  <h1>Venice</h1>
  <select id="model" aria-label="Model"></select>
  <button class="icon" id="new" title="New chat">+</button>
  <button class="icon" id="cfg" title="Settings">&#9881;</button>
</div>

<div id="main"></div>

<div id="ft">
  <textarea id="in" rows="1" placeholder="Ask anything"></textarea>
  <button id="send" title="Send">&#10148;</button>
</div>

<div id="setup" class="hide">
  <div class="card">
    <h2>Connect Venice</h2>
    <p>Paste an inference API key from <b>venice.ai/settings/api</b>. It stays in this browser only and goes straight to the API.</p>
    <input id="key" type="password" placeholder="Venice API key" autocomplete="off">
    <div class="row"><input type="checkbox" id="ttsbox"><label for="ttsbox">Read replies aloud</label></div>
    <button class="big" id="save">Save</button>
    <p style="margin:14px 0 0;text-align:center"><a href="#" id="wipe">Clear this chat</a></p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var API="https://api.venice.ai/api/v1";
  var K_KEY="vd_key",K_MOD="vd_model",K_LOG="vd_log",K_TTS="vd_tts";
  var FALLBACK=["venice-uncensored-1-2","zai-org-glm-5","llama-3.3-70b","mistral-small-3-2-24b-instruct"];
  var log=[],busy=false,ctrl=null,key="",tts=false;
  var main=document.getElementById("main"),inp=document.getElementById("in"),send=document.getElementById("send");

  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function save(){try{localStorage.setItem(K_LOG,JSON.stringify(log));}catch(e){}}
  function bubble(role,text){
    var d=document.createElement("div");
    d.className="msg "+(role==="user"?"u":role==="assistant"?"a":"sys");
    d.textContent=text;
    main.appendChild(d);
    main.scrollTop=main.scrollHeight;
    return d;
  }
  function paint(){
    main.innerHTML="";
    for(var i=0;i<log.length;i++){bubble(log[i].r,log[i].c);}
  }

  function showSetup(){
    document.getElementById("key").value=key;
    document.getElementById("ttsbox").checked=tts;
    document.getElementById("setup").classList.remove("hide");
  }
  function hideSetup(){document.getElementById("setup").classList.add("hide");}

  document.getElementById("save").addEventListener("click",function(){
    var v=document.getElementById("key").value.trim().replace(/^Bearer\s+/i,"");
    if(!v)return;
    key=v;
    tts=document.getElementById("ttsbox").checked;
    try{localStorage.setItem(K_KEY,key);localStorage.setItem(K_TTS,tts?"1":"0");}catch(e){}
    hideSetup();
    inp.focus();
  });
  document.getElementById("cfg").addEventListener("click",showSetup);
  document.getElementById("wipe").addEventListener("click",function(e){
    e.preventDefault();log=[];save();main.innerHTML="";
  });
  document.getElementById("new").addEventListener("click",function(){
    log=[];save();main.innerHTML="";inp.focus();
  });

  inp.addEventListener("input",function(){
    inp.style.height="auto";
    inp.style.height=Math.min(inp.scrollHeight,150)+"px";
  });
  inp.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send.blur();sendIt();}
  });
  send.addEventListener("click",sendIt);

  function speak(t){
    fetch(API+"/audio/speech",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model:"tts-kokoro",input:t.slice(0,1800),voice:"af_sky"})
    }).then(function(r){return r.ok?r.blob():null;}).then(function(b){
      if(b)new Audio(URL.createObjectURL(b)).play();
    }).catch(function(){});
  }

  function sendIt(){
    if(busy){if(ctrl)ctrl.abort();return;}
    var text=inp.value.trim();
    if(!text)return;
    if(!key){showSetup();return;}

    inp.value="";inp.style.height="auto";
    log.push({r:"user",c:text});save();bubble("user",text);

    var msgs=[];
    for(var i=0;i<log.length;i++){
      if(log[i].r==="user"||log[i].r==="assistant")msgs.push({role:log[i].r,content:log[i].c});
    }

    var node=bubble("assistant","");
    var full="";
    busy=true;send.innerHTML="&#9632;";
    ctrl=("AbortController" in window)?new AbortController():null;

    fetch(API+"/chat/completions",{
      method:"POST",
      signal:ctrl?ctrl.signal:undefined,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({
        model:document.getElementById("model").value,
        messages:msgs,
        stream:true,
        venice_parameters:{strip_thinking_response:true,include_venice_system_prompt:true}
      })
    }).then(function(res){
      if(!res.ok){
        return res.text().then(function(t){throw new Error(res.status+" "+t.slice(0,200));});
      }
      var rd=res.body.getReader(),dec=new TextDecoder(),buf="";
      function pump(){
        return rd.read().then(function(r){
          if(r.done)return;
          buf+=dec.decode(r.value,{stream:true});
          var parts=buf.split("\n\n");
          buf=parts.pop();
          for(var i=0;i<parts.length;i++){
            var ln=parts[i].replace(/^\s+/,"");
            if(ln.indexOf("data:")!==0)continue;
            var d=ln.slice(5).replace(/^\s+/,"");
            if(!d||d==="[DONE]")continue;
            try{
              var j=JSON.parse(d);
              var ch=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
              if(ch){full+=ch;node.textContent=full;main.scrollTop=main.scrollHeight;}
            }catch(e){}
          }
          return pump();
        });
      }
      return pump();
    }).then(function(){
      log.push({r:"assistant",c:full||"(no text)"});save();
      if(tts&&full)speak(full);
    }).catch(function(e){
      if(e&&e.name==="AbortError"){
        node.textContent=full+"\n\n[stopped]";
        log.push({r:"assistant",c:full+"\n\n[stopped]"});save();
      }else{
        var m="Error: "+(e&&e.message?e.message:"request failed");
        if(String(m).indexOf("401")>=0)m+="\nKey rejected. Tap the gear and re-enter it.";
        if(String(m).indexOf("429")>=0)m+="\nRate limited. Wait a moment.";
        node.className="msg sys";
        node.textContent=m;
        log.push({r:"sys",c:m});save();
      }
    }).then(function(){
      busy=false;send.innerHTML="&#10148;";ctrl=null;
    });
  }

  function loadModels(){
    var sel=document.getElementById("model");
    var saved=null;
    try{saved=localStorage.getItem(K_MOD);}catch(e){}
    function fill(list){
      sel.innerHTML="";
      for(var i=0;i<list.length;i++){
        var o=document.createElement("option");
        o.value=list[i].id;
        o.textContent=list[i].n;
        sel.appendChild(o);
      }
      var hit=null;
      for(var j=0;j<list.length;j++){if(list[j].id===saved)hit=list[j].id;}
      sel.value=hit||list[0].id;
    }
    fetch(API+"/models?type=text").then(function(r){return r.ok?r.json():null;}).then(function(j){
      var out=[];
      if(j&&j.data){
        for(var i=0;i<j.data.length;i++){
          var m=j.data[i];
          if(!m||!m.id||m.id.indexOf("embed")>=0)continue;
          var nm=(m.model_spec&&m.model_spec.name)||m.id;
          out.push({id:m.id,n:nm.length>42?nm.slice(0,42):nm});
        }
      }
      if(!out.length){for(var k=0;k<FALLBACK.length;k++)out.push({id:FALLBACK[k],n:FALLBACK[k]});}
      fill(out);
    }).catch(function(){
      var f=[];
      for(var i=0;i<FALLBACK.length;i++)f.push({id:FALLBACK[i],n:FALLBACK[i]});
      fill(f);
    });
    sel.addEventListener("change",function(){
      try{localStorage.setItem(K_MOD,sel.value);}catch(e){}
    });
  }

  try{
    key=localStorage.getItem(K_KEY)||"";
    tts=localStorage.getItem(K_TTS)==="1";
    log=JSON.parse(localStorage.getItem(K_LOG)||"[]");
  }catch(e){log=[];}

  paint();
  loadModels();
  if(!key)showSetup();
})();
</script>
</body>
</html>
